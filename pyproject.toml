[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-utility"
dynamic = ["version"] # from setup.cfg
description = "A metrics utility for Ansible"
dependencies = [
    "boto3~=1.35",
    "cryptography>=44.0.1",
    "botocore~=1.35",
    "distro~=1.8",
    "django~=5.2",
    "kubernetes>=33.1.0",
    "openpyxl~=3.1",
    "pandas~=3.0",
    "psycopg~=3.1",
    "requests~=2.28",
    "segment-analytics-python>=2.3.6",
    "setuptools>=65",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
  {name = "Red Hat", email = "info@ansible.com"},
]
keywords = ["ansible", "metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
metrics-utility = "metrics_utility:manage"

[project.urls]
Repository = "https://github.com/ansible/metrics-utility.git"
Issues = "https://github.com/ansible/metrics-utility/issues"
Changelog = "https://github.com/ansible/metrics-utility/blob/devel/CHANGELOG.md"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest>=8.3.4",
    "ruff>=0.16.0",
    "jsonschema>=4.26.0",
]

# Do not uncomment the line below. We need to be able to override the version via a file, and this
# causes the "version" key in setup.cfg to be ignored.
# [tool.setuptools_scm]

[tool.setuptools]
# Include and exclude directories for the final package
packages = {find = {include = ["metrics_utility*"], exclude = ["tools*", "workers*", "sql*", "out*", "docs*", "mock_awx*"]}}

[tool.setuptools.package-data]
# Include only necessary package data
"*" = ["*.json", "*.sql", "*.txt", "*.jsonschema"]

[tool.ruff]
# Allow longer lines than ruff's default 88.
line-length = 150
# PEP 8 standard
indent-width = 4

[tool.ruff.format]
# Normalize double quotes to single quotes
quote-style = "single"
# No tabs, spaces only
indent-style = "space"

[tool.ruff.lint]
# Explicit rule selection (aligned with metrics-service where applicable)
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "E",    # pycodestyle errors
    "EXE",  # flake8-executable
    "F",    # pyflakes
    "FLY",  # flynt
    "FURB", # refurb
    "I",    # isort
    "ISC",  # implicit string concatenation
    "PERF", # perflint
    "PIE",  # flake8-pie
    "PLR",  # pylint refactoring
    "RUF",  # ruff-specific
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "T10",  # flake8-debugger
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "B006",     # mutable default arg — billing_provider_params={} is intentional, never mutated
    "B008",     # function call in default arg — DataframeOutput()/DictOutput() defaults are intentional
    "B011",     # assert False — used in unreachable-code guards
    "B017",     # assert blind exception — testing that any Exception is raised is valid
    "B904",     # raise from — TODO: add exception chaining
    "B905",     # zip() without strict= — behavior change, needs careful review
    "C402",     # unnecessary generator — dict() with generator is fine
    "C417",     # dict.fromkeys() — dict comprehension is more readable
    "C420",     # dict.fromkeys() — dict comprehension is more readable
    "FLY002",   # str.join() is more readable than f-string for list-of-strings patterns
    "FURB171",  # single-item membership test — intentional for future extension
    "PERF401",  # list.extend/comprehension — readability over micro-optimization in data processing
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches — report builders and test helpers are inherently branchy
    "PLR0913",  # too many arguments — complex functions
    "PLR0915",  # too many statements — report builders are inherently large
    "PLR0917",  # too many positional arguments
    "PLR1704",  # redefining argument — intentional shadowing in storage put() methods
    "PLR1714",  # repeated equality — single-element `in {..}` is intentional for future extension
    "PLR2004",  # magic value comparison — common in tests and data processing
    "RUF001",   # ambiguous unicode — intentional special characters
    "RUF002",   # ambiguous unicode in docstring
    "RUF003",   # ambiguous unicode in comment
    "RUF010",   # f-string !s conversion — str() is more readable
    "RUF012",   # ClassVar for mutable class attrs — Django models don't use this
    "RUF015",   # next(iter()) — list()[0] is more readable
    "S101",     # use of assert — common in tests and validation
    "S105",     # hardcoded password — false positives on setting key names
    "S108",     # /tmp paths — test doubles use /tmp/fake-*
    "S110",     # try-except-pass — sometimes intentional (fallback logic)
    "S113",     # request timeout — TODO: add timeouts to requests calls
    "S306",     # mktemp — used safely in controlled context
    "S608",     # SQL injection — using psycopg.sql safely, revisit
    "SIM102",   # nested if — complex conditions, more readable nested
    "SIM103",   # return not — if/return False/return True reads clearer
    "SIM105",   # contextlib.suppress — try/except/pass reads clearer in some spots
    "SIM108",   # ternary operator — many would create very long lines
    "SIM112",   # capitalized env var — `container` env var is genuinely lowercase (systemd/podman)
    "SIM115",   # context manager for files — some handles span multiple methods
    "SIM117",   # nested with — long mock chains, more readable nested
]

[tool.ruff.lint.per-file-ignores]
"metrics_utility/test/**" = [
    "PERF",     # performance micro-optimizations don't matter in tests
    "S106",     # hardcoded passwords in test fixtures
    "S310",     # URL scheme auditing is noise in tests
    "S311",     # random is fine for test data, not crypto
    "S603",     # subprocess call in tests
]
"metrics_utility/management/commands/*" = [
    "E501",     # help text epilogs are inherently long single-line strings
]
"tools/**" = [
    "C901",     # complexity limits don't matter in dev tools
    "EXE001",   # scripts have shebangs but don't need +x in repo
    "PERF",     # performance micro-optimizations don't matter in dev tools
    "S104",     # binding to all interfaces in dev tools
    "S311",     # random is fine for test data generation
    "S602",     # subprocess with shell=True in dev tools
    "S603",     # subprocess call in dev tools
    "S607",     # partial executable path in dev tools
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-statements = 50
max-args = 8

[tool.ruff.lint.isort]
# Separate direct imports from 'from' imports
lines-between-types = 1
# Use a single line after each import block
lines-after-imports = 2
