[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-utility"
version = "0.8.0dev"
description = "A metrics utility for Ansible"
dependencies = [
    "boto3~=1.43.14",
    "distro~=1.9.0",
    "django~=6.0.5",
    "pandas~=3.0.3",
    "psycopg~=3.3.4",
    "requests~=2.34.2",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
  {name = "Red Hat", email = "info@ansible.com"},
]
keywords = ["ansible", "metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
metrics-utility = "metrics_utility:manage"

[project.urls]
Repository = "https://github.com/ansible/metrics-utility.git"
Issues = "https://github.com/ansible/metrics-utility/issues"
Changelog = "https://github.com/ansible/metrics-utility/blob/devel/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

# Do not uncomment the line below. setuptools_scm would override the version above.
# [tool.setuptools_scm]

[tool.setuptools]
# Include and exclude directories for the final package
packages = {find = {include = ["metrics_utility*"], exclude = ["tools*", "sql*", "out*", "docs*", "mock_awx*"]}}

[tool.setuptools.package-data]
# Include only necessary package data
"*" = ["*.json", "*.sql", "*.txt"]

[tool.pytest.ini_options]
filterwarnings = [
    "error::ResourceWarning",
    "ignore:Automation Controller modules not found:UserWarning",
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore",
]

[tool.coverage.run]
source = ["metrics_utility"]
omit = ["metrics_utility/test/*"]

[tool.ruff]
# Allow longer lines than ruff's default 88.
line-length = 150
# PEP 8 standard
indent-width = 4

[tool.ruff.format]
# Normalize double quotes to single quotes
quote-style = "single"
# No tabs, spaces only
indent-style = "space"

[tool.ruff.lint]
extend-select = [
    "B007",  # Unused loop control variable
    "B904",  # raise ... from err in except blocks
    "C4",    # Unnecessary list/dict/set comprehension wrappers
    "D200",  # Single-line docstring should fit on one line
    "D405",  # Capitalize section names
    "D417",  # Document all arguments
    "E",     # PEP 8 errors (indentation, syntax)
    "F",     # Pyflakes (unused imports, undefined names)
    "I",     # Sort imports
    "N",     # PEP 8 naming conventions
    "PIE",   # Misc cleanups (unnecessary pass, ...)
    "PT",    # Pytest best practices
    "RET",   # Unnecessary else after return
    "RUF002", # Ambiguous unicode characters
    "RUF005", # Iterable unpacking instead of concatenation
    "RUF059", # Unused unpacked variable
    "RUF100", # Unused noqa directives
    "T20",   # Flag print() calls
    "UP",    # Python syntax upgrades
    "W",     # PEP 8 warnings (whitespace, line breaks)
]

[tool.ruff.lint.isort]
# Separate direct imports from 'from' imports
lines-between-types = 1
# Use a single line after each import block
lines-after-imports = 2
