[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "metrics-utility"
version = "0.8.0dev"
description = "A metrics utility for Ansible"
dependencies = [
    "boto3~=1.35.96",
    "botocore~=1.35.96",
    "distro~=1.9.0",
    "django~=5.2.7",
    "kubernetes>=33.1.0",  # ~= can't express cross-major compat (33, 35, ...)
    "pandas~=2.3",
    "psycopg~=3.3.0",
    "requests~=2.32.5",
    "segment-analytics-python~=2.3.4",
    "setuptools~=80.9.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [
  {name = "Red Hat", email = "info@ansible.com"},
]
keywords = ["ansible", "metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.scripts]
metrics-utility = "metrics_utility:manage"

[project.urls]
Repository = "https://github.com/ansible/metrics-utility.git"
Issues = "https://github.com/ansible/metrics-utility/issues"
Changelog = "https://github.com/ansible/metrics-utility/blob/devel/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

# Do not uncomment the line below. setuptools_scm would override the version above.
# [tool.setuptools_scm]

[tool.setuptools]
# Include and exclude directories for the final package
packages = {find = {include = ["metrics_utility*"], exclude = ["tools*", "sql*", "out*", "docs*", "mock_awx*"]}}

[tool.setuptools.package-data]
# Include only necessary package data
"*" = ["*.json", "*.sql", "*.txt"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Automation Controller modules not found:UserWarning",
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore",
]

[tool.ruff]
# Allow longer lines than ruff's default 88.
line-length = 150
# PEP 8 standard
indent-width = 4

[tool.ruff.format]
# Normalize double quotes to single quotes
quote-style = "single"
# No tabs, spaces only
indent-style = "space"

[tool.ruff.lint]
extend-select = [
# Essential PEP 8 errors (indentation, syntax)
    "E",
# PEP 8 warnings (whitespace, line breaks)
    "W",
# PEP 8 naming conventions
#   "N",
# Python syntax upgrades
#   "UP",
# Sort imports
    "I",
]

[tool.ruff.lint.isort]
# Separate direct imports from 'from' imports
lines-between-types = 1
# Use a single line after each import block
lines-after-imports = 2
