x-metrics-service: &metrics-service
  build:
    context: ../../../metrics-service
    dockerfile: Dockerfile.dev
  volumes:
    - ../../../metrics-service:/app:z
    - /app/.venv
  tmpfs:
    - /app/metrics_service.egg-info:mode=0777
  environment: &metrics-service-env
    METRICS_SERVICE_MODE: development
    METRICS_SERVICE_DATABASES__default__HOST: postgres
    METRICS_SERVICE_DATABASES__default__PASSWORD: metrics_service
    METRICS_SERVICE_DATABASES__awx__HOST: postgres
    METRICS_SERVICE_DATABASES__awx__USER: awx
    METRICS_SERVICE_DATABASES__awx__PASSWORD: awx
    MOCK_SEGMENT_URL: "http://mock-segment:8765"

services:
  seaweedfs:
    image: "mirror.gcr.io/chrislusf/seaweedfs:latest"
    container_name: seaweedfs
    ports:
      - "8333:8333"
    environment:
      AWS_ACCESS_KEY_ID: "myuseraccesskey"
      AWS_SECRET_ACCESS_KEY: "myusersecretkey"
      S3_BUCKET: "metricsutilitys3"
    tmpfs:
      - /data:mode=1777
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8333"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: "mirror.gcr.io/postgres"
    container_name: postgres
    environment:
      POSTGRES_DB: "awx"
      POSTGRES_USER: "myuser"
      POSTGRES_PASSWORD: "mypassword"
    ports:
      - "5432:5432"
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-0-roles.sql
      - ./latest.sql:/docker-entrypoint-initdb.d/init-1-schema.sql
      - ./initial.sql:/docker-entrypoint-initdb.d/init-2-initial.sql
      - ./functions.sql:/docker-entrypoint-initdb.d/init-3-functions.sql
      - ./conf_setting.sql:/docker-entrypoint-initdb.d/init-4-conf_setting.sql
      - ./main_hostmetric.sql:/docker-entrypoint-initdb.d/init-5-main_hostmetric.sql
      - ./main_instance.sql:/docker-entrypoint-initdb.d/init-6-main_instance.sql
      - ./main_jobhostsummary.sql:/docker-entrypoint-initdb.d/init-7-main_jobhostsummary.sql
      - ./dab_feature_flags.sql:/docker-entrypoint-initdb.d/init-8-dab_feature_flags.sql
      - ./main_indirectmanagednodeaudit.sql:/docker-entrypoint-initdb.d/init-9-main_indirectmanagednodeaudit.sql

  postgres-wait:
    image: "mirror.gcr.io/postgres"
    depends_on:
      - postgres
    command: |
      sh -c '
        echo "Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres; do
          sleep 2
        done
      '

  metrics-utility:
    image: "mirror.gcr.io/python"
    container_name: metrics-utility
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres-wait:
        condition: service_completed_successfully
      mock-segment:
        condition: service_started
      mock-prometheus:
        condition: service_started
    volumes:
      - ../..:/app_ro
    tmpfs:
      - /app:rw,exec,mode=0755
    working_dir: /app
    profiles: ["pytest"] # makes this service non-default, except when --profile=pytest
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://seaweedfs:8333"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
      METRICS_UTILITY_DB_HOST: "postgres"
      MOCK_SEGMENT_URL: "http://mock-segment:8765"
      MOCK_PROMETHEUS_URL: "http://mock-prometheus:9090"
    entrypoint: |
      sh -c '
        set -e
        # mirror.gcr.io/python has no rsync, use tar to copy with excludes
        mkdir -p /app/metrics-utility
        tar -c --exclude=.git --exclude=.venv --exclude=.ruff_cache --exclude=build --exclude=dist -C /app_ro . | tar -x -C /app/metrics-utility

        cd /app/metrics-utility/

        pip install uv
        uv sync

        uv run pytest -s -v
      '

  mock-segment:
    build:
      context: ../mock-segment-server
    container_name: mock-segment
    ports:
      - "8765:8765"
    environment:
      MOCK_SEGMENT_PORT: "8765"

  mock-prometheus:
    build:
      context: ../mock-prometheus-server
    container_name: mock-prometheus
    ports:
      - "9090:9090"
    environment:
      MOCK_PROMETHEUS_PORT: "9090"

  metrics-utility-env:
    build:
      context: .
      args:
        SRC_MOUNT: /app
    image: "mirror.gcr.io/python"
    container_name: metrics-utility-env
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres-wait:
        condition: service_completed_successfully
    volumes:
      - ../../:/app         # Mount the current local directory to /app in the container
    working_dir: /app
    profiles: ["env"] # makes this service non-default, except when --profile=env
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://seaweedfs:8333"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
      METRICS_UTILITY_DB_HOST: "postgres"
    entrypoint: |
      sh -c '
        set -e

        ls

        pip install uv
        uv sync

        env | grep ^METRICS | sort

        tail -f /dev/null
      '

  metrics-service-init:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: /app/scripts/init.sh
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"
      METRICS_SERVICE_DASHBOARD_COLLECTION__COLLECTION_SCHEDULE_CRON: "*/5 * * * *"

  metrics-service-web:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${METRICS_SERVICE_PORT:-8000}:8000"

  metrics-service-dispatcher:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py run_dispatcherd --workers=4 --log-level=DEBUG
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"
      METRICS_SERVICE_DASHBOARD_COLLECTION__COLLECTION_SCHEDULE_CRON: "*/5 * * * *"

  metrics-service-scheduler:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py run_task_scheduler --log-level=DEBUG --check-interval=60
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"

  metrics-service-pytest:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
    profiles: ["pytest-svc"]
    working_dir: /app
    entrypoint: |
      sh -c '
        set -e
        git config --global --add safe.directory /app
        uv sync
        uv run pytest -s -v
      '
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_MODE: test

  redis:
    image: "mirror.gcr.io/library/redis:7.4.8"
    container_name: redis
    profiles: ["awx"]
    volumes:
      - ./awx/redis.conf:/usr/local/etc/redis/redis.conf:z
      - redis_socket:/var/run/redis/:rw
    entrypoint: ["redis-server"]
    command: ["/usr/local/etc/redis/redis.conf"]

  awx:
    image: "ghcr.io/ansible/awx_devel:devel"
    container_name: awx
    hostname: awx-1
    profiles: ["awx"]
    command: launch_awx.sh supervisord --pidfile=/tmp/supervisor_pid -n
    environment:
      AWX_GROUP_QUEUES: tower
      MAIN_NODE_TYPE: hybrid
      RECEPTORCTL_SOCKET: /var/run/awx-receptor/receptor.sock
      CONTROL_PLANE_NODE_COUNT: 1
      EXECUTION_NODE_COUNT: 0
      AWX_LOGGING_MODE: stdout
      DJANGO_SUPERUSER_PASSWORD: admin
      RUN_MIGRATIONS: 1
    working_dir: /awx_devel
    volumes:
      - ../../../awx:/awx_devel:z
      - ./awx/database.py:/etc/tower/conf.d/database.py:z
      - ./awx/websocket_secret.py:/etc/tower/conf.d/websocket_secret.py:z
      - ./awx/local_settings.py:/etc/tower/conf.d/local_settings.py:z
      - ./awx/nginx.conf:/etc/nginx/nginx.conf:z
      - ./awx/nginx.locations.conf:/etc/nginx/conf.d/nginx.locations.conf:z
      - ./awx/SECRET_KEY:/etc/tower/SECRET_KEY:z
      - ./awx/receptor.conf:/etc/receptor/receptor.conf:z
      - ../../../awx/tools/docker-compose/supervisor.conf:/etc/supervisord.conf:z
      - redis_socket:/var/run/redis/:rw
      - /sys/fs/cgroup:/sys/fs/cgroup
    privileged: true
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8013:8013"
      - "8043:8043"
    tty: true

  ansible-ui:
    image: "mirror.gcr.io/node:20"
    container_name: ansible-ui
    profiles: ["ansible-ui"]
    working_dir: /app/frontend/awx
    volumes:
      - ../../../ansible-ui:/app:z
      - ansible_ui_node_modules:/app/node_modules
    environment:
      AWX_SERVER: "https://awx:8043"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      awx:
        condition: service_started
    ports:
      - "4101:4101"
    entrypoint: |
      sh -c '
        cd /app
        npm ci
        cd frontend/awx
        npm run start -- --host 0.0.0.0
      '

volumes:
  redis_socket:
  ansible_ui_node_modules:
