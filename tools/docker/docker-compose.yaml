x-metrics-service: &metrics-service
  build:
    context: ../../../metrics-service
    dockerfile: Dockerfile.dev
  volumes:
    - ../../../metrics-service:/app:z
    - /app/.venv
  tmpfs:
    - /app/metrics_service.egg-info:mode=0777
  environment: &metrics-service-env
    METRICS_SERVICE_MODE: development
    METRICS_SERVICE_DATABASES__default__HOST: postgres
    METRICS_SERVICE_DATABASES__default__PASSWORD: metrics_service
    METRICS_SERVICE_DATABASES__awx__HOST: postgres
    METRICS_SERVICE_DATABASES__awx__USER: awx
    METRICS_SERVICE_DATABASES__awx__PASSWORD: awx

services:
  rustfs:
    image: "mirror.gcr.io/rustfs/rustfs:latest"
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "rustfsadmin"
      RUSTFS_SECRET_KEY: "rustfsadmin"
    tmpfs:
      - /data:mode=1777
    command: server /data --console-address ":9001"

  rustfs-setup:
    image: "mirror.gcr.io/python"
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: "rustfsadmin"
      AWS_SECRET_ACCESS_KEY: "rustfsadmin"
      AWS_DEFAULT_REGION: "us-east-1"
    entrypoint: |
      sh -c '
        set -e
        pip install -q awscli
        echo "Waiting for RustFS to be ready..."
        for i in $$(seq 30); do
          aws --endpoint-url http://rustfs:9000 s3 ls 2>/dev/null && break
          sleep 2
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://metricsutilitys3 || true
        echo "Bucket metricsutilitys3 ready"
      '

  postgres:
    image: "mirror.gcr.io/postgres"
    container_name: postgres
    environment:
      POSTGRES_DB: "awx"
      POSTGRES_USER: "myuser"
      POSTGRES_PASSWORD: "mypassword"
    ports:
      - "5432:5432"
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/init-0-roles.sql
      - ./latest.sql:/docker-entrypoint-initdb.d/init-1-schema.sql
      - ./functions.sql:/docker-entrypoint-initdb.d/init-2-functions.sql
      - ./conf_setting.sql:/docker-entrypoint-initdb.d/init-3-conf_setting.sql
      - ./main_hostmetric.sql:/docker-entrypoint-initdb.d/init-4-main_hostmetric.sql
      - ./main_instance.sql:/docker-entrypoint-initdb.d/init-5-main_instance.sql
      - ./main_jobhostsummary.sql:/docker-entrypoint-initdb.d/init-6-main_jobhostsummary.sql
      - ./dab_feature_flags.sql:/docker-entrypoint-initdb.d/init-7-dab_feature_flags.sql
      - ./main_indirectmanagednodeaudit.sql:/docker-entrypoint-initdb.d/init-8-main_indirectmanagednodeaudit.sql

  postgres-wait:
    image: "mirror.gcr.io/postgres"
    depends_on:
      - postgres
    command: |
      sh -c '
        echo "Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres; do
          sleep 2
        done
      '

  metrics-utility:
    image: "mirror.gcr.io/python"
    container_name: metrics-utility
    depends_on:
      rustfs-setup:
        condition: service_completed_successfully
      postgres-wait:
        condition: service_completed_successfully
      mock-segment:
        condition: service_started
      mock-prometheus:
        condition: service_started
    volumes:
      - ../..:/app_ro
    tmpfs:
      - /app:rw,exec,mode=0755
    working_dir: /app
    profiles: ["pytest"] # makes this service non-default, except when --profile=pytest
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "rustfsadmin"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://rustfs:9000"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "rustfsadmin"
      METRICS_UTILITY_DB_HOST: "postgres"
      MOCK_SEGMENT_URL: "http://mock-segment:8765"
      MOCK_PROMETHEUS_URL: "http://mock-prometheus:9090"
    entrypoint: |
      sh -c '
        set -e
        # mirror.gcr.io/python has no rsync, use tar to copy with excludes
        mkdir -p /app/metrics-utility
        tar -c --exclude=.git --exclude=.venv --exclude=.ruff_cache --exclude=build --exclude=dist -C /app_ro . | tar -x -C /app/metrics-utility

        cd /app/metrics-utility/

        pip install uv
        uv sync

        uv run pytest -s -v
      '

  mock-segment:
    build:
      context: ../mock-segment-server
    container_name: mock-segment
    ports:
      - "8765:8765"
    environment:
      MOCK_SEGMENT_PORT: "8765"

  mock-prometheus:
    build:
      context: ../mock-prometheus-server
    container_name: mock-prometheus
    ports:
      - "9090:9090"
    environment:
      MOCK_PROMETHEUS_PORT: "9090"

  metrics-utility-env:
    build:
      context: .
      args:
        SRC_MOUNT: /app
    image: "mirror.gcr.io/python"
    container_name: metrics-utility-env
    depends_on:
      rustfs-setup:
        condition: service_completed_successfully
      postgres-wait:
        condition: service_completed_successfully
    volumes:
      - ../../:/app         # Mount the current local directory to /app in the container
    working_dir: /app
    profiles: ["env"] # makes this service non-default, except when --profile=env
    environment:
      METRICS_UTILITY_BUCKET_ACCESS_KEY: "rustfsadmin"
      METRICS_UTILITY_BUCKET_ENDPOINT: "http://rustfs:9000"
      METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
      METRICS_UTILITY_BUCKET_REGION: "us-east-1"
      METRICS_UTILITY_BUCKET_SECRET_KEY: "rustfsadmin"
      METRICS_UTILITY_DB_HOST: "postgres"
    entrypoint: |
      sh -c '
        set -e

        ls

        pip install uv
        uv sync

        env | grep ^METRICS | sort

        tail -f /dev/null
      '

  metrics-service-init:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: /app/scripts/init.sh
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"
      METRICS_SERVICE_DASHBOARD_COLLECTION__COLLECTION_SCHEDULE_CRON: "*/5 * * * *"

  metrics-service-web:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${METRICS_SERVICE_PORT:-8000}:8000"

  metrics-service-dispatcher:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py run_dispatcherd --workers=4 --log-level=DEBUG
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"
      METRICS_SERVICE_DASHBOARD_COLLECTION__COLLECTION_SCHEDULE_CRON: "*/5 * * * *"

  metrics-service-scheduler:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
      metrics-service-init:
        condition: service_completed_successfully
    profiles: ["service"]
    entrypoint: python manage.py run_task_scheduler --log-level=DEBUG --check-interval=60
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_FEATURE__DASHBOARD_COLLECTION: "true"

  metrics-service-pytest:
    <<: *metrics-service
    depends_on:
      postgres-wait:
        condition: service_completed_successfully
    profiles: ["pytest-svc"]
    working_dir: /app
    entrypoint: |
      sh -c '
        set -e
        git config --global --add safe.directory /app
        uv sync
        uv run pytest -s -v
      '
    environment:
      <<: *metrics-service-env
      METRICS_SERVICE_MODE: test
