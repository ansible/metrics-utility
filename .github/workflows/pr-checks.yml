name: "PR checks"

on:
  pull_request:

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: "Checkout metrics-utility (${{ github.ref }})"
        uses: actions/checkout@v5

      - name: "Install uv"
        uses: astral-sh/setup-uv@v6

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: "Check for changes in uv.lock"
        run: |
          uv sync
          if ! git diff --quiet uv.lock; then
            echo "uv.lock has changed. Run 'uv sync' locally and commit the updated lock file."
            git diff uv.lock
            exit 1  # Fail the job
          fi

      - name: "Generate and check requirements files"
        run: |
          # Generate requirements files
          uv export --format requirements-txt --no-dev > requirements.txt.new
          uv export --format requirements-txt > dev-requirements.txt.new

          # Check if requirements.txt exists and compare
          if [ -f "requirements.txt" ]; then
            if ! diff -q requirements.txt requirements.txt.new > /dev/null; then
              echo "❌ requirements.txt is out of sync with uv.lock"
              echo "Please run './sync-requirements.sh' or 'uv export --format requirements-txt --no-dev > requirements.txt'"
              echo ""
              echo "Differences found:"
              diff requirements.txt requirements.txt.new || true
              exit 1
            fi
          else
            echo "⚠️  requirements.txt not found, creating it..."
            mv requirements.txt.new requirements.txt
          fi

          # Check if dev-requirements.txt exists and compare
          if [ -f "dev-requirements.txt" ]; then
            if ! diff -q dev-requirements.txt dev-requirements.txt.new > /dev/null; then
              echo "❌ dev-requirements.txt is out of sync with uv.lock"
              echo "Please run './sync-requirements.sh' or 'uv export --format requirements-txt > dev-requirements.txt'"
              echo ""
              echo "Differences found:"
              diff dev-requirements.txt dev-requirements.txt.new || true
              exit 1
            fi
          else
            echo "⚠️  dev-requirements.txt not found, creating it..."
            mv dev-requirements.txt.new dev-requirements.txt
          fi

          # Clean up temp files
          rm -f requirements.txt.new dev-requirements.txt.new

          echo "✅ Requirements files are in sync with uv.lock"

      - name: "Run ruff check"
        run: |
          uvx ruff check --output-format=github .

      - name: "Check ruff format"
        run: |
          uvx ruff format --check

      - name: "Validate sync-requirements.sh"
        run: |
          # Check if sync script is executable
          if [ ! -x "./sync-requirements.sh" ]; then
            echo "❌ sync-requirements.sh is not executable"
            echo "Run: chmod +x sync-requirements.sh"
            exit 1
          fi

          # Validate shell script syntax (similar to ruff for Python)
          if command -v shellcheck &> /dev/null; then
            echo "🔍 Running shellcheck on sync-requirements.sh"
            shellcheck ./sync-requirements.sh
          else
            echo "⚠️  shellcheck not available, skipping shell script linting"
          fi

          echo "✅ sync-requirements.sh validation passed"

      - name: "One logger to rule them all"
        run: |
          if rgrep "logging.getLogger(" metrics_utility | cut -d: -f1 | grep -v logger.py | grep . ; then
            echo "^ Please use logger imported from metrics_utility.logger instead of creating a new one" 1>&2
            false
          else
            true
          fi
