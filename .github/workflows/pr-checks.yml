name: "PR checks"

on:
  pull_request:

jobs:
  eol-notice:
    name: "0.7 end of life"
    # Guarded on the base ref so the warning stays put if this file is ever carried to
    # another branch. A PR runs the workflows of the branch it targets.
    if: github.base_ref == 'stable-0.7'
    runs-on: ubuntu-latest
    steps:
      - name: "Warn that stable-0.7 is no longer maintained"
        run: |
          echo "::warning title=stable-0.7 is end of life::The 0.7 branch is no longer maintained. Open this against devel, or against stable-2.6/stable-2.7 in ansible-automation-platform/metrics-utility if it needs to ship in AAP."
          {
            echo "## stable-0.7 is end of life"
            echo
            echo "The \`0.7\` branch is no longer maintained, and this pull request targets it."
            echo
            echo "- Upstream development continues on \`devel\`."
            echo "- Fixes that need to ship in AAP 2.6 or 2.7 go to \`stable-2.6\` or \`stable-2.7\` in [ansible-automation-platform/metrics-utility](https://github.com/ansible-automation-platform/metrics-utility)."
            echo
            echo "This is a warning only and does not block the pull request."
          } >> "$GITHUB_STEP_SUMMARY"

  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout metrics-utility (${{ github.ref }})"
        uses: actions/checkout@v6

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Check for changes in uv.lock"
        run: |
          uv sync
          if ! git diff --quiet uv.lock; then
            echo "uv.lock has changed. Run 'uv sync' locally and commit the updated lock file."
            git diff uv.lock
            exit 1  # Fail the job
          fi

      - name: "Run ruff check"
        run: |
          uv run ruff check --output-format=github .

      - name: "Check ruff format"
        run: |
          uv run ruff format --check

      - name: "One logger to rule them all"
        run: |
          if rgrep "logging.getLogger(" metrics_utility | cut -d: -f1 | grep -v logger.py | grep . ; then
            echo "^ Please use logger imported from metrics_utility.logger instead of creating a new one" 1>&2
            false
          else
            true
          fi
