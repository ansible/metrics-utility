name: Schema Change Review

on:
  workflow_run:
    workflows: ["Schema review event gate"]
    types: [completed]

jobs:
  request-review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: Resolve current pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            let numbers = (run.pull_requests || [])
              .map((pullRequest) => pullRequest.number)
              .filter((number) => Number.isInteger(number));

            if (numbers.length === 0 && run.head_sha) {
              const repositories = [];
              if (run.head_repository?.owner?.login && run.head_repository?.name) {
                repositories.push({
                  owner: run.head_repository.owner.login,
                  repo: run.head_repository.name,
                });
              }
              repositories.push({ owner: context.repo.owner, repo: context.repo.repo });

              for (const target of repositories) {
                const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  ...target,
                  commit_sha: run.head_sha,
                });
                numbers.push(
                  ...response.data
                    .filter((pullRequest) => pullRequest.base?.repo?.full_name === repository)
                    .map((pullRequest) => pullRequest.number),
                );
                if (numbers.length > 0) {
                  break;
                }
              }
            }

            for (const number of numbers) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              const pullRequest = response.data;
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.repo.full_name !== repository
              ) {
                continue;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const schemaChanged = files.some((file) =>
                file.filename.startsWith('metrics_utility/schemas/'));
              const allowed =
                pullRequest.base.repo.owner.login === 'ansible' ||
                pullRequest.base.ref.startsWith('stable-2.');

              core.setOutput('number', String(pullRequest.number));
              core.setOutput('schema_changed', String(schemaChanged));
              core.setOutput('allowed', String(allowed));
              core.setOutput('author', pullRequest.user.login);
              core.setOutput('actor', run.actor?.login || pullRequest.user.login);
              core.setOutput('url', pullRequest.html_url);
              core.setOutput('head_ref', pullRequest.head.ref);
              break;
            }

      - name: Request schema review
        if: steps.pr.outputs.number != '' && steps.pr.outputs.schema_changed == 'true' && steps.pr.outputs.allowed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        with:
          script: |
            const allReviewers = ['hunterkepley', 'himdel', 'MilanPospisil', 'cshiels-ie', 'AparnaKarve', 'dmzoneill'];
            const filteredReviewers = allReviewers.filter((reviewer) => reviewer !== process.env.PR_AUTHOR);
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.PR_NUMBER),
              reviewers: filteredReviewers,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: "⚠️ This PR modifies files in `metrics-utility/schemas/`. One person from Emerging Services (@hunterkepley / @himdel / @MilanPospisil / @cshiels-ie), and one person from Analytics HCC (@dmzoneill / @AparnaKarve) must approve. DO NOT merge until both teams have approved. [Contract here](https://handbook.eng.ansible.com/Teams/Emerging-Services-Team/Metrics-Utility/Contracts/billing-analytics-contract)",
            });

      - name: Send Slack notification
        if: steps.pr.outputs.number != '' && steps.pr.outputs.schema_changed == 'true' && steps.pr.outputs.allowed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CLOUD_WEBHOOK_URL }}
          PR_ACTOR: ${{ steps.pr.outputs.actor }}
          PR_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          payload=$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg actor "$PR_ACTOR" \
            --arg branch "$PR_HEAD_REF" \
            --arg number "$PR_NUMBER" \
            --arg url "$PR_URL" \
            '{
              text: ("Files changed in `" + $repository + "` by " + $actor),
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: ("*Schema files changed* in <" + $url + "|PR #" + $number + ">\n*By:* " + $actor + "\n*Branch:* `" + $branch + "`")
                }
              }]
            }')
          curl --fail-with-body -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$payload"
