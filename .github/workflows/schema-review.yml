name: Schema Change Review

on:
  pull_request_target:
    types: [opened, ready_for_review, synchronize, edited]
    paths:
      - 'metrics_utility/schemas/**'

jobs:
  request-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
    steps:
      - name: Request schema review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const allReviewers = ['hunterkepley', 'himdel', 'MilanPospisil', 'cshiels-ie'];
            const author = context.payload.pull_request.user.login;
            const filtered_reviewers = allReviewers.filter(reviewer => reviewer !== author);
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: filtered_reviewers
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "⚠️ This PR modifies files in `metrics-utility/schemas/`. One person from Emerging Services (@hunterkepley / @himdel / @MilanPospisil / @cshiels-ie), and one person from Analytics HCC (@dmzoneill / @AparnaKarve) must approve. DO NOT merge until both teams have approved the changes. [Contract here](https://handbook.eng.ansible.com/Teams/Emerging-Services-Team/Metrics-Utility/Contracts/billing-analytics-contract)"
            });

      - name: Send Slack notification
        run: |
          curl -X POST "${{ secrets.SLACK_CLOUD_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d @- <<EOF
          {
            "text": "Files changed in \`${{ github.repository }}\` by ${{ github.actor }}",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Schema files changed* in <${{ github.event.pull_request.html_url }}|PR #${{ github.event.pull_request.number }}>\n*By:* ${{ github.actor }}\n*Branch:* \`${{ github.ref_name }}\`"
                }
              }
            ]
          }
          EOF
