---
name: CICD

on:
  pull_request:
  push:
  workflow_call:
    inputs:
      validate-all:
        required: false
        type: boolean
        default: false

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    name: Static Analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install UV
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.23"

        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project with uv
        run: uv sync --all-extras --dev

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Configure JSCPD Linter
        run : |-
          # echo "disable=SC2086" > ~/.shellcheckrc
          mkdir -vp .github/linters/config/
          curl -o .github/linters/config/.jscpd.json https://raw.githubusercontent.com/ansible/metrics-utility/main/.github/linters/.jscpd.json


  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Pytest
        run: |-
          pip3 install pytest pytest-mock mock mocker
          # pytest -s -v tests/
