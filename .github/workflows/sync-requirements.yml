name: Sync Requirements Files

on:
  push:
    branches:
      - devel
    paths:
      - "uv.lock"
      - "pyproject.toml"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-requirements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Generate requirements.txt (production)
        run: uv export --format requirements-txt --no-dev > requirements.txt

      - name: Generate dev-requirements.txt (development)
        run: uv export --format requirements-txt > dev-requirements.txt

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet requirements.txt dev-requirements.txt; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add requirements.txt dev-requirements.txt
          git commit -m "chore: sync requirements files from uv.lock

          Auto-generated by GitHub Action on uv.lock changes.

          - requirements.txt: production dependencies
          - dev-requirements.txt: all dependencies including dev tools"
          git push
