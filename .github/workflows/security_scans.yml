name: SAST Snyk Code

on:
  schedule:
    - cron: '23 14 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snyk-code-${{ github.ref }}
  cancel-in-progress: true

env:
  # SNYK_TOKEN is an org-level secret for the `ansible` org, so it is not
  # available in the mirrored downstream repository.
  HAS_SNYK_TOKEN: ${{ secrets.SNYK_TOKEN != '' }}

jobs:
  security:
    if: github.repository_owner == 'ansible'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report missing SNYK_TOKEN
        if: env.HAS_SNYK_TOKEN != 'true'
        run: |
          echo "::warning::SNYK_TOKEN is not available; skipping the Snyk Code scan."
          {
            echo "### Snyk Code scan skipped"
            echo "The \`SNYK_TOKEN\` secret is not available in this repository/org."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master
        if: env.HAS_SNYK_TOKEN == 'true'

      - name: Generate code vulnerability report
        if: env.HAS_SNYK_TOKEN == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk code test --project-name="${{ github.repository }}" --report ${{ github.workspace }}
        continue-on-error: true
