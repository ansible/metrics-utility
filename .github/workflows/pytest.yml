name: "Pytest tests"

on:
  push:
    branches: ["devel"]
  pull_request_target:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout metrics-utility (${{ github.ref }})"
        uses: actions/checkout@v6
        if: ${{ ! github.base_ref }}

      - name: "Checkout metrics-utility (${{ github.event.pull_request.head.ref }})"
        uses: actions/checkout@v6
        if: ${{ github.base_ref }}
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: "Install uv"
        uses: astral-sh/setup-uv@v7

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Set up postgresql"
        run: |
          sudo apt install postgresql postgresql-client
          sudo systemctl start postgresql.service  # ubuntu

      - name: "Wait for postgresql"
        timeout-minutes: 1
        run: |
          until pg_isready; do
            sleep 4
          done

      - name: "Import SQL dump"
        run: |
          cat tools/docker/{roles,latest,conf_setting,main_hostmetric,main_instance,main_jobhostsummary}.sql | sudo su - postgres -c psql

      - name: "Set up Garage"
        run: |
          mkdir -p ~/.local/bin
          # Download Garage v1.0.0 for x86_64 Linux
          curl -L https://garagehq.deuxfleurs.fr/_releases/v1.0.0/x86_64-unknown-linux-musl/garage -o ~/.local/bin/garage
          chmod +x ~/.local/bin/garage

          # Create Garage configuration
          mkdir -p ~/.config/garage
          cat > ~/.config/garage/garage.toml <<EOF
          metadata_dir = "$HOME/.local/share/garage/meta"
          data_dir = "$HOME/.local/share/garage/data"
          db_engine = "sqlite"
          replication_factor = 1
          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"

          [s3_api]
          s3_region = "us-east-1"
          api_bind_addr = "[::]:3902"
          root_domain = ".s3.garage.localhost"

          [admin]
          api_bind_addr = "[::]:3900"
          admin_token = "admin-token-secret"
          EOF

          # Create data directories
          mkdir -p "$HOME/.local/share/garage/meta"
          mkdir -p "$HOME/.local/share/garage/data"

          # Start Garage server in background
          garage -c ~/.config/garage/garage.toml server &

          # Export Garage PID for later cleanup
          echo "GARAGE_PID=$!" >> $GITHUB_ENV

      - name: "Wait for Garage and configure cluster"
        timeout-minutes: 2
        run: |
          # Wait for Garage to be ready
          until curl -s http://localhost:3900/health > /dev/null 2>&1; do
            echo "Waiting for Garage to start..."
            sleep 2
          done
          echo "Garage is ready!"

          # Get node ID
          NODE_ID=$(curl -s http://localhost:3900/v1/status | jq -r '.nodes[0].id')
          echo "Node ID: $NODE_ID"

          # Configure cluster layout
          curl -s -H "Authorization: Bearer admin-token-secret" \
            -H "Content-Type: application/json" \
            -X POST http://localhost:3900/v1/layout \
            -d "[{\"id\": \"$NODE_ID\", \"zone\": \"dc1\", \"capacity\": 1073741824, \"tags\": []}]"

          sleep 2

          # Apply layout
          curl -s -H "Authorization: Bearer admin-token-secret" \
            -H "Content-Type: application/json" \
            -X POST http://localhost:3900/v1/layout/apply \
            -d '{"version": 1}'

          sleep 3
          echo "Cluster layout configured!"

      - name: "Create Garage bucket and credentials"
        run: |
          # Create access key
          KEY_RESPONSE=$(curl -s -H "Authorization: Bearer admin-token-secret" \
            -H "Content-Type: application/json" \
            -X POST http://localhost:3900/v1/key \
            -d '{"name": "ci-test-key"}')

          KEY_ID=$(echo "$KEY_RESPONSE" | jq -r '.accessKeyId')
          KEY_SECRET=$(echo "$KEY_RESPONSE" | jq -r '.secretAccessKey')

          echo "Generated credentials:"
          echo "Key ID: $KEY_ID"

          # Export credentials for pytest step
          echo "METRICS_UTILITY_BUCKET_ACCESS_KEY=$KEY_ID" >> $GITHUB_ENV
          echo "METRICS_UTILITY_BUCKET_SECRET_KEY=$KEY_SECRET" >> $GITHUB_ENV

          # Create bucket
          BUCKET_RESPONSE=$(curl -s -H "Authorization: Bearer admin-token-secret" \
            -H "Content-Type: application/json" \
            -X POST http://localhost:3900/v1/bucket \
            -d '{"globalAlias": "metricsutilitys3"}')

          BUCKET_ID=$(echo "$BUCKET_RESPONSE" | jq -r '.id')
          echo "Bucket ID: $BUCKET_ID"

          # Grant permissions using Garage CLI
          garage bucket allow --read --write metricsutilitys3 --key "$KEY_ID"

          echo "Garage setup complete!"

      - name: "Patch mock_awx postgres config"
        run: |
          sed -i '/NAME/s/awx/postgres/' mock_awx/settings/__init__.py
          sed -i '/USER/s/myuser/awx/' mock_awx/settings/__init__.py
          sed -i '/PASSWORD/s/mypassword/awx/' mock_awx/settings/__init__.py

      - name: "Run pytest"
        env:
          # METRICS_UTILITY_BUCKET_ACCESS_KEY and SECRET_KEY set by previous step
          METRICS_UTILITY_BUCKET_ENDPOINT: "http://localhost:3902"
          METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
          METRICS_UTILITY_BUCKET_REGION: "us-east-1"
          METRICS_UTILITY_DB_HOST: "localhost"
        run: |
          uv run pytest -s -v --cov=. --cov-report=xml

      - name: "Cleanup Garage"
        if: always()
        run: |
          if [ -n "$GARAGE_PID" ]; then
            kill $GARAGE_PID || true
          fi

      - name: "Send code coverage report to Sonar Cloud"
        uses: SonarSource/sonarqube-scan-action@v6
        if: ${{ github.base_ref }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ansible
          SONAR_PROJECT_KEY: ansible_metrics-utility
          SONAR_TOKEN: ${{ secrets.CICD_ORG_SONAR_TOKEN_CICD_BOT }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=ansible
            -Dsonar.projectKey=ansible_metrics-utility
            "-Dsonar.pullrequest.base=${{ github.base_ref }}"
            "-Dsonar.pullrequest.branch=${{ github.head_ref }}"
            "-Dsonar.pullrequest.key=${{ github.event.pull_request.number }}"
            -Dsonar.pullrequest.provider=github
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: "Send code coverage report to Sonar Cloud"
        uses: SonarSource/sonarqube-scan-action@v6
        if: ${{ ! github.base_ref }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ansible
          SONAR_PROJECT_KEY: ansible_metrics-utility
          SONAR_TOKEN: ${{ secrets.CICD_ORG_SONAR_TOKEN_CICD_BOT }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=ansible
            -Dsonar.projectKey=ansible_metrics-utility
            -Dsonar.python.coverage.reportPaths=coverage.xml
