name: "Pytest tests"

on:
  push:
    branches: ['devel']
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout metrics-utility"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Set up postgresql"
        run: |
          sudo apt install postgresql postgresql-client
          sudo systemctl start postgresql.service  # ubuntu

      - name: "Wait for postgresql"
        timeout-minutes: 1
        run: |
          until pg_isready; do
            sleep 4
          done

      - name: "Import SQL dump"
        run: |
          cat tools/docker/{roles,latest,functions,conf_setting,main_hostmetric,main_instance,main_jobhostsummary,dab_feature_flags,main_indirectmanagednodeaudit}.sql | sudo su - postgres -c psql

      - name: "Pull SeaweedFS"
        run: |
          mkdir -p ~/.local/bin
          curl -fL https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_amd64.tar.gz -o /tmp/seaweedfs.tar.gz
          curl -fL https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_amd64.tar.gz.md5 -o /tmp/seaweedfs.md5

          EXPECTED=$(awk '{print $1}' /tmp/seaweedfs.md5)
          ACTUAL=$(md5sum /tmp/seaweedfs.tar.gz | awk '{print $1}')
          [ "$EXPECTED" = "$ACTUAL" ]

          tar -xzf /tmp/seaweedfs.tar.gz -C ~/.local/bin
          chmod +x ~/.local/bin/weed

      - name: "Start SeaweedFS"
        run: |
          AWS_ACCESS_KEY_ID=myuseraccesskey \
          AWS_SECRET_ACCESS_KEY=myusersecretkey \
          S3_BUCKET=metricsutilitys3 \
          weed mini -dir=/tmp/seaweedfs-data &

      - name: "Wait for SeaweedFS"
        timeout-minutes: 1
        run: |
          until curl -s -o /dev/null http://localhost:8333; do
            sleep 2
          done

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/mock-segment-server/go.mod

      - name: "Start mock servers"
        timeout-minutes: 1
        run: |
          go build -C tools/mock-segment-server -o /tmp/mock-segment-server .
          go build -C tools/mock-prometheus-server -o /tmp/mock-prometheus-server .
          /tmp/mock-segment-server &
          /tmp/mock-prometheus-server &
          until curl -sf http://localhost:8765/requests > /dev/null; do sleep 1; done
          until curl -sf http://localhost:9090/requests > /dev/null; do sleep 1; done

      - name: "Run pytest"
        env:
          METRICS_UTILITY_BUCKET_ACCESS_KEY: "myuseraccesskey"
          METRICS_UTILITY_BUCKET_ENDPOINT: "http://localhost:8333"
          METRICS_UTILITY_BUCKET_NAME: "metricsutilitys3"
          METRICS_UTILITY_BUCKET_REGION: "us-east-1"
          METRICS_UTILITY_BUCKET_SECRET_KEY: "myusersecretkey"
          METRICS_UTILITY_DB_HOST: "localhost"
          METRICS_UTILITY_DB_NAME: "postgres"
          METRICS_UTILITY_DB_USER: "awx"
          METRICS_UTILITY_DB_PASSWORD: "awx"
          MOCK_SEGMENT_URL: "http://localhost:8765"
          MOCK_PROMETHEUS_URL: "http://localhost:9090"
        run: |
          uv run pytest -s -v --cov=. --cov-branch --cov-report=xml

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unit-tests
          fail_ci_if_error: false

      - name: "Upload code coverage report"
        if: ${{ github.base_ref }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

      - name: "Save off PR number and analysed commit"
        if: github.event_name == 'pull_request'
        # HEAD here is the commit coverage.xml was generated against (on a
        # pull_request event actions/checkout checks out the fake merge commit).
        # sonar_checks.yml must analyse this exact commit, otherwise coverage
        # line numbers won't match the source and the whole report is dropped.
        run: |
          echo "PR ${{ github.event.pull_request.number }}" > pr_number.txt
          git rev-parse HEAD > coverage_sha.txt

      - name: "Upload PR number and analysed commit"
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr_number
          path: |
            pr_number.txt
            coverage_sha.txt

      - name: "Send code coverage report to Sonar Cloud (on push)"
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        if: ${{ ! github.base_ref }}
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ansible
          SONAR_PROJECT_KEY: ansible_metrics-utility
          SONAR_TOKEN: ${{ secrets.CICD_ORG_SONAR_TOKEN_CICD_BOT }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=ansible
            -Dsonar.projectKey=ansible_metrics-utility
            -Dsonar.python.coverage.reportPaths=coverage.xml

  pytest-service:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout metrics-utility"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: "Install uv"
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: "Set up postgresql"
        run: |
          sudo apt install postgresql postgresql-client
          sudo systemctl start postgresql.service

      - name: "Wait for postgresql"
        timeout-minutes: 1
        run: |
          until pg_isready; do
            sleep 4
          done

      - name: "Import SQL dump"
        run: |
          cat tools/docker/{roles,latest,functions,conf_setting,main_hostmetric,main_instance,main_jobhostsummary,dab_feature_flags,main_indirectmanagednodeaudit}.sql | sudo su - postgres -c psql

      - name: "Set up Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/mock-segment-server/go.mod

      - name: "Start mock segment server"
        timeout-minutes: 1
        run: |
          go build -C tools/mock-segment-server -o /tmp/mock-segment-server .
          /tmp/mock-segment-server &
          until curl -sf http://localhost:8765/requests > /dev/null; do sleep 1; done

      - name: "Clone metrics-service"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ansible/metrics-service
          ref: devel
          path: metrics-service-checkout

      - name: "Install metrics-service with local metrics-utility"
        working-directory: metrics-service-checkout
        run: |
          uv add --editable "${GITHUB_WORKSPACE}"

      - name: "Run migrations"
        working-directory: metrics-service-checkout
        env:
          METRICS_SERVICE_DATABASES__default__HOST: localhost
          METRICS_SERVICE_DATABASES__default__USER: metrics_service
          METRICS_SERVICE_DATABASES__default__PASSWORD: metrics_service
          METRICS_SERVICE_DATABASES__default__OPTIONS__sslmode: disable
          METRICS_SERVICE_MODE: test
          DJANGO_SETTINGS_MODULE: metrics_service.settings
        run: |
          uv run python manage.py migrate --noinput

      - name: "Run metrics-service pytest"
        working-directory: metrics-service-checkout
        env:
          METRICS_SERVICE_DATABASES__default__HOST: localhost
          METRICS_SERVICE_DATABASES__default__PORT: "5432"
          METRICS_SERVICE_DATABASES__default__USER: metrics_service
          METRICS_SERVICE_DATABASES__default__PASSWORD: metrics_service
          METRICS_SERVICE_DATABASES__default__NAME: metrics_service
          METRICS_SERVICE_DATABASES__default__OPTIONS__sslmode: disable
          METRICS_SERVICE_DATABASES__awx__HOST: localhost
          METRICS_SERVICE_DATABASES__awx__USER: awx
          METRICS_SERVICE_DATABASES__awx__PASSWORD: awx
          DJANGO_SETTINGS_MODULE: metrics_service.settings
          METRICS_SERVICE_MODE: test
          MOCK_SEGMENT_URL: "http://localhost:8765"
        run: |
          uv run pytest -s -v
