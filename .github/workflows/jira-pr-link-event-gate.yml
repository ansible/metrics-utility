name: Jira PR link event gate

on:
  pull_request:
    types: [opened, edited, reopened]

# This workflow is intentionally unprivileged. The follow-up workflow runs
# from the default branch and obtains its own trusted view of the pull request.
permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Complete event gate
        run: true
